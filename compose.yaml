# Port is overridable from the host:  API_PORT=9000 docker compose up --build
services:
  api:
    build: .
    image: meter-difference-api:latest
    environment:
      API_PORT: ${API_PORT:-8000}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('API_PORT','8000')+'/healthz',timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # One-shot acceptance service: runs once against the api and exits.
  #   docker compose up --build --exit-code-from verify --abort-on-container-exit
  verify:
    image: meter-difference-api:latest
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:${API_PORT:-8000}
    command: ["python", "verify.py"]
    restart: "no"
